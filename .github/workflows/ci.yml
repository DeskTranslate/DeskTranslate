name: Windows quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      DESKTRANSLATE_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install verified environment
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-build-isolation -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Quality gates
        run: |
          python -m ruff check src tests tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check src tests tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m mypy src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q --basetemp=.test-tmp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m desktranslate --smoke-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip_audit --require-hashes --disable-pip -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m build --no-isolation --outdir dist-python
      - name: Build portable app
        run: python tools/build.py
      - name: Packaged startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/DeskTranslate/DeskTranslate.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktranslate-windows
          path: |
            dist/*.zip
            dist/*sbom.json
            dist/SHA256SUMS.txt
          retention-days: 14

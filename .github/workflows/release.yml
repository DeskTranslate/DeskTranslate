name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      DESKTRANSLATE_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install and check
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-build-isolation -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff check src tests tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check src tests tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m mypy src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q --basetemp=.test-tmp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip_audit --require-hashes --disable-pip -r requirements-windows.lock
      - name: Prepare verified installer compiler
        run: ./tools/install_inno.ps1
      - name: Prepare matching LGPL library sources
        run: python tools/library_sources.py
      - name: Compile installer and portable app
        run: python tools/build.py --installer
      - name: Smoke packaged runtime
        run: |
          $process = Start-Process -FilePath "$PWD/dist/DeskTranslate/DeskTranslate.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktranslate-release-candidate
          path: |
            dist/*.exe
            dist/*.zip
            dist/*sbom.json
            dist/SHA256SUMS.txt
          retention-days: 30
